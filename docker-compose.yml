version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: etc-postgres
    restart: always
    environment:
      POSTGRES_DB: etc_dashboard
      POSTGRES_USER: etc_user
      POSTGRES_PASSWORD: etc_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
